name: Generate Neon SDK lockfile
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    if: github.ref == 'refs/heads/feat/casa-neon-migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casa-neon-migration
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install @neon/neon-js --save
      - name: Commit dependency and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build: add Neon JS SDK and lockfile" || exit 0
          git push origin HEAD:feat/casa-neon-migration
