name: Bootstrap Neon dependencies (temporary)
on:
  push:
    branches: [feat/casa-neon-runtime-migration]
    paths: [.github/workflows/neon-dependencies.yml]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/casa-neon-runtime-migration
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned Neon SDK and Netlify Blobs dependencies
        run: npm install --save-exact @neon/neon-js @netlify/blobs jose
      - name: Commit lockfile into feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || (git commit -m "build: pin Neon SDK, Netlify Blobs and jose" && git push origin HEAD:feat/casa-neon-runtime-migration)
